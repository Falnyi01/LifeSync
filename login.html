<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | LifeSync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">LifeSync</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="auth-intro">Log in to continue organizing your college life.</p>

        <form id="login-form" class="auth-form">
          <div class="field-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="username"
            />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              maxlength="128"
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="primary-button">Log In</button>
          <p id="login-message" class="auth-message" role="status"></p>
        </form>

        <a class="auth-back-link" href="register.html">Create an account</a>
        <a class="auth-back-link" href="index.html">Back to planner</a>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
