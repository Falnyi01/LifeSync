<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | LifeSync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="registration-title">
        <p class="eyebrow">LifeSync</p>
        <h1 id="registration-title">Create your account</h1>
        <p class="auth-intro">Start organizing your college life in one place.</p>

        <form id="registration-form" class="auth-form">
          <div class="field-group">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              autocomplete="name"
            />
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
              aria-describedby="password-help"
            />
            <small id="password-help">Use at least 8 characters.</small>
          </div>

          <button type="submit" class="primary-button">Create Account</button>
          <p id="registration-message" class="auth-message" role="status"></p>
        </form>

        <a class="auth-back-link" href="index.html">Back to planner</a>
      </section>
    </main>

    <script src="registration.js"></script>
  </body>
</html>
